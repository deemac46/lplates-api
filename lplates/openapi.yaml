        areasCovered:
          type: string
          example: "Dublin City Centre, Temple Bar, Smithfield"
          description: Comma-separated areas within the county
        latitude:
          type: number
          format: double
          nullable: true
          example: 53.3498
          description: Approximate latitude for map display (privacy-safe)
        longitude:
          type: number
          format: double
          nullable: true
          example: -6.2603
          description: Approximate longitude for map display (privacy-safe)
        hasAdaptedVehicle:
          type: boolean
