        userId:
          type: integer
          format: int64
          example: 5
        username:
          type: string
          example: john_doe
        role:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Instructor:
      type: object
      properties:
        instructorId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        approvalStatus:
          $ref: '#/components/schemas/ApprovalStatus'
        gender:
          type: string
        phoneNumber:
          type: string
        adiNumber:
          type: string
        transmission:
          type: string
          example: manual
        yearsExperience:
          type: integer
        rating:
          type: number
          format: double
        carMake:
          type: string
        carModel:
          type: string
        locations:
          type: array
          items:
            type: string
        profilePicture:
          type: string
          nullable: true
          description: URL relative to the API base, e.g. /uploads/instructors/1/abc.jpg
        description:
          type: string
        reviewsCount:
          type: integer
        agreeTerms:
          type: boolean
        available:
          type: boolean
          default: true
