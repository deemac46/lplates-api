
# Application properties
spring.application.name=lplates
server.port=8080

log.level.org.springframework=INFO
logging.level.com.dmc.lplates=INFO
spring.docker.compose.enabled=false

# JWT
jwt.secret=lplates-jwt-secret-key-minimum-32-chars-for-hs256-algorithm-lplates
jwt.expiration=86400000

mockdata.enabled=true

# File uploads (instructor profile pictures)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
